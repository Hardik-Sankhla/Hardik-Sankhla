name: Generate Pac-Man Game

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/main.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Generate Pac-Man contribution graph
        run: |
          npx -y pacman-contribution-graph@5.3.1 \
            --game pacman \
            --platform github \
            --username ${{ github.repository_owner }} \
            --gameTheme github \
            --output dist/pacman-contribution-graph.svg

      - name: Generate Pac-Man contribution graph (dark theme)
        run: |
          npx -y pacman-contribution-graph@5.3.1 \
            --game pacman \
            --platform github \
            --username ${{ github.repository_owner }} \
            --gameTheme github-dark \
            --output dist/pacman-contribution-graph-dark.svg

      - name: Push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}