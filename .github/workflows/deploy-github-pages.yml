name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'content/**'
      - 'scripts/sync-content.mjs'
      - '.github/workflows/deploy-github-pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'content/**'
      - 'scripts/sync-content.mjs'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GITHUB_PAGES: 'true'

jobs:
  build:
    name: Build for GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Sync generated content
        run: node scripts/sync-content.mjs

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- apps/web/generated apps/docs/docs; then
            git add apps/web/generated apps/docs/docs
            git commit -m "chore: sync generated content [skip ci]"
            git push
          else
            echo "No generated content changes to commit"
          fi

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build web app for GitHub Pages
        run: npm run build
        working-directory: apps/web
        env:
          GITHUB_PAGES: 'true'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4